# Release metadata, not foundry config: `rainix-tag-release` rewrites `version`
# from the tag it is triggered by. `[external.*]` is the section foundry
# reserves for another tool's config: it never merges it into a profile and
# never warns about it.
[external.package]
name = "rainlang-deploy"
# Deploy repo: a normal PR does not bump this; only a release moves it, in
# lockstep with the frozen `src/generated/<tag>/` snapshot it names.
version = "0.1.10"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

solc = "0.8.25"
evm_version = "cancun"

# CRITICAL: 1_000_000, NOT the 100_000 that rain.factory.deploy /
# rain.extrospection.deploy use. Every Zoltu address in `src/generated/` is a
# pure function of its creation bytecode, which is a pure function of these
# settings AND the `rainlang` package sources it compiles against. These are the
# settings the live parser, store and interpreter were produced with in the
# pre-split hybrid `rainlang` repo; changing the run count regenerates the
# `src/generated/candidate/` pins at different addresses, off the live
# deployments.
optimizer = true
optimizer_runs = 1000000

# EIP-170: RainlangInterpreter and RainlangParser share one run count because
# tests and scripts import both. 18,500 is the highest measured count keeping
# the interpreter at least 256 B under the limit (24,044 B; 24,604 B at 18,750,
# 24,976 B at 30,000-65,000). Changing it moves both Zoltu addresses.
additional_compiler_profiles = [{ name = "eip170", optimizer_runs = 18500 }]
compilation_restrictions = [
  { paths = "src/concrete/RainlangInterpreter.sol", min_optimizer_runs = 18500, max_optimizer_runs = 18500 },
  { paths = "src/concrete/RainlangParser.sol", min_optimizer_runs = 18500, max_optimizer_runs = 18500 },
]

ffi = true

bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
  { access = "read-write", path = "./out/test/" },
  { access = "read-write", path = "./meta" },
  { access = "read-write", path = "./src" },
  { access = "read-write", path = "./crates/bindings/abi" },
  { access = "read-write", path = "./crates/test_fixtures/abi" },
  { access = "read", path = "./out" },
  # `LibRainDeploySnapshot.deployTag` reads `[external.package].version` to name
  # the frozen per-release snapshot dir.
  { access = "read", path = "foundry.toml" },
  # `BuildScript.regenerateConfig` reads these and stages the spliced result.
  { access = "read", path = "./.env.example" },
  { access = "read-write", path = "./.staged-config" },
  { access = "write", path = "./deployments/latest/RainlangParser" },
  { access = "write", path = "./deployments/latest/RainlangStore" },
  { access = "write", path = "./deployments/latest/RainlangInterpreter" },
  { access = "write", path = "./deployments/latest/RainlangCompiler" },
  { access = "read", path = ".github/workflows/manual-sol-artifacts.yaml" },
]

gas_limit = "18446744073709551615"

# `recursive_deps` is off, so every package an import resolves through is
# declared here, including the ones reached only through `rainlang`'s src.
[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
"rainlang" = "0.2.30"
rain-deploy = "0.1.25"
rain-factory = "0.2.5"
"rain-extrospection" = "0.1.16"
"rain-intorastring" = "0.1.4"
"rain-lib-hash" = "0.1.27"
"rain-lib-memkv" = "0.2.0"
"rain-lib-typecast" = "0.1.4"
"rain-math-binary" = "0.1.4"
"rain-math-float" = "0.3.11"
"rain-math-float-deploy" = "0.1.9"
"rain-metadata" = "0.1.43"
rain-sol-codegen = "0.1.39"
"rain-solmem" = "0.1.28"
"rain-string" = "0.3.9"
"rain-tofu-erc20-decimals" = "0.1.4"
rain-tofu-erc20-decimals-deploy = "0.1.4"

[soldeer]
recursive_deps = false

[fuzz]
runs = 2048

# Generated by `script/Build.sol` from `supportedNetworks()`, which is what
# `script/Deploy.sol` broadcasts to — between the markers and nowhere else.
# rain-deploy:generated:rpc_endpoints:begin
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
flare = "${FLARE_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
# rain-deploy:generated:rpc_endpoints:end

# `rainix-manual-sol-artifacts` passes `--verify` by default and exports exactly
# these variable names, so a deploy without this section broadcasts and then
# fails with no API key configured for the chain. One entry per
# `[rpc_endpoints]` alias, because the deploy goes to all of them.
#
# Robinhood Chain (4663) is not indexed by Etherscan V2. Its Blockscout speaks
# the Etherscan API, so the entry points there (the key is ignored). That
# explorer has rejected non-browser clients, so if `--verify` fails there,
# verify afterwards through Sourcify: `forge verify-contract --verifier
# sourcify --chain 4663 ...`.
# rain-deploy:generated:etherscan:begin
[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}", chain = 42161 }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}", chain = 84532 }
bsc = { key = "${CI_DEPLOY_BSC_ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}", chain = 14 }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}", chain = 137 }
robinhood = { key = "${CI_DEPLOY_ROBINHOOD_ETHERSCAN_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
# rain-deploy:generated:etherscan:end
